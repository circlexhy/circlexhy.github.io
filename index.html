// ================================================================
// 3. 加载 giscus 评论（只加载一次）
// ================================================================

let giscusLoaded = false;

function loadGiscus() {
    const container = document.getElementById('giscus-container');
    if (!container) return;
    if (giscusLoaded) return;
    if (container.querySelector('iframe')) return;

    const script = document.createElement('script');
    script.src = 'https://giscus.app/client.js';
    script.setAttribute('data-repo', 'circlexhy/circlexhy.github.io');
    script.setAttribute('data-repo-id', 'R_kgDOSf6J8Q');
    script.setAttribute('data-category', 'Announcements');
    script.setAttribute('data-category-id', 'DIC_kwDOSf6J8c4C9Pdi');
    script.setAttribute('data-mapping', 'pathname');
    script.setAttribute('data-strict', '0');
    script.setAttribute('data-reactions-enabled', '1');
    script.setAttribute('data-emit-metadata', '0');
    script.setAttribute('data-input-position', 'bottom');
    script.setAttribute('data-theme', 'preferred_color_scheme');
    script.setAttribute('data-lang', 'zh-CN');
    script.setAttribute('crossorigin', 'anonymous');
    script.async = true;

    container.appendChild(script);
    giscusLoaded = true;
}

// ================================================================
// 4. 加载 GitHub 用户信息
// ================================================================

let githubLoaded = false;

async function loadGitHubProfile() {
    const container = document.getElementById('github-content');
    if (!container) return;
    if (githubLoaded) return;
    githubLoaded = true;

    const username = 'circlexhy';
    const loading = document.getElementById('github-loading');
    const content = document.getElementById('github-content');
    const error = document.getElementById('github-error');

    try {
        const response = await fetch(`https://api.github.com/users/${username}`);
        if (!response.ok) throw new Error('用户不存在');

        const data = await response.json();

        document.getElementById('gh-avatar').src = data.avatar_url;
        document.getElementById('gh-name').textContent = data.name || data.login;
        document.getElementById('gh-link').href = data.html_url;
        document.getElementById('gh-link').textContent = `@${data.login}`;
        document.getElementById('gh-bio').textContent = data.bio || 'Nothing';
        document.getElementById('gh-repos').textContent = data.public_repos || 0;
        document.getElementById('gh-followers').textContent = data.followers || 0;
        document.getElementById('gh-following').textContent = data.following || 0;
        document.getElementById('gh-location').textContent = data.location || 'Unknown';

        loading.classList.add('hidden');
        content.classList.remove('hidden');
        error.classList.add('hidden');

    } catch (err) {
        console.error('加载 GitHub 信息失败:', err);
        loading.classList.add('hidden');
        content.classList.add('hidden');
        error.classList.remove('hidden');
    }
}

// ================================================================
// 5. 导航核心函数 
// ================================================================

function navigateTo(pageName) {
    const page = pages[pageName];
    if (!page) return;

    const app = document.getElementById('app');
    app.innerHTML = page.content;

    document.title = page.title;
    history.pushState({ page: pageName }, '', `#${pageName}`);

    document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.page === pageName);
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });

    // 只有切换到首页时才加载评论
    if (pageName === 'home') {
        giscusLoaded = false;
        setTimeout(loadGiscus, 200);
    }

    // 切换到关于页时加载 GitHub 信息
    if (pageName === 'about') {
        setTimeout(loadGitHubProfile, 200);
    }
}

// ================================================================
// 6. 绑定事件
// ================================================================

document.addEventListener('DOMContentLoaded', () => {
    // 导航点击
    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const page = link.dataset.page;
            if (page) navigateTo(page);
        });
    });

    // 浏览器前进/后退
    window.addEventListener('popstate', (e) => {
        const page = e.state?.page || 'home';
        const pageData = pages[page];
        if (pageData) {
            document.getElementById('app').innerHTML = pageData.content;
            document.title = pageData.title;
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('active', link.dataset.page === page);
            });
        }
    });

    // 初始化：从 URL hash 读取，默认首页
    const hash = window.location.hash.replace('#', '');
    const initialPage = pages[hash] ? hash : 'home';
    navigateTo(initialPage);
});

// 暴露到全局，方便调试
window.navigateTo = navigateTo;
</script>
