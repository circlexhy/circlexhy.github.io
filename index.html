<script>
// ================================================================
// 1. 主题切换逻辑（保持不变）
// ================================================================
const themeToggle = document.getElementById('theme-toggle');
const htmlEl = document.documentElement;

if (localStorage.getItem('theme') === 'dark' || 
   (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    htmlEl.classList.add('dark');
}

themeToggle.addEventListener('click', () => {
    htmlEl.classList.toggle('dark');
    localStorage.setItem('theme', htmlEl.classList.contains('dark') ? 'dark' : 'light');
});

document.addEventListener('keydown', (e) => {

// 页面路由表
const pages = {
    home: {
        title: 'FTS GithubPage | Tech & Life',
        content: homePage
    },
    archives: {
        title: 'FTS GithubPage | 归档',
        content: archivesPage
    },
    tags: {

        content: tagsPage
    },
    friends: {
        title: 'FTS GithubPage | 友链',
        content: friendsPage
    },
    about: {
        title: 'FTS GithubPage | 关于',
        content: aboutPage

};

// ================================================================
// 3. 导航核心函数
// ================================================================

function navigateTo(pageName) {
    // 获取页面数据
    const page = pages[pageName];
    if (!page) return;

    // 更新内容（带淡入动画）
    const app = document.getElementById('app');
    app.innerHTML = page.content;

    // 更新页面标题
    document.title = page.title;

    // 更新 URL hash（不刷新页面）
    history.pushState({ page: pageName }, '', `#${pageName}`);

    // 更新导航高亮
    document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.page === pageName);
    });

    // 滚动到顶部
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ================================================================
// 4. 绑定事件
// ================================================================

document.addEventListener('DOMContentLoaded', () => {
    // 导航点击
    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const page = link.dataset.page;
            if (page) navigateTo(page);
        });
    });

    // 浏览器前进/后退
    window.addEventListener('popstate', (e) => {
        const page = e.state?.page || 'home';
        // 直接渲染，不 pushState（避免重复记录）
        const pageData = pages[page];
        if (pageData) {
            document.getElementById('app').innerHTML = pageData.content;
            document.title = pageData.title;
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('active', link.dataset.page === page);
            });
        }
    });

    // 初始化：从 URL hash 读取，默认首页
    const hash = window.location.hash.replace('#', '');
    const initialPage = pages[hash] ? hash : 'home';
    navigateTo(initialPage);
});

// 暴露到全局，方便调试
window.navigateTo = navigateTo;
</script>
