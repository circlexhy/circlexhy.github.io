<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="200" height="200" fill="none" stroke="red" stroke-width="0.5">
  
  <!-- 方块部分 -->
  <circle cx="10" cy="10" r="6" stroke="red"/>
  
  <polygon points="7,7 10,8 13,7 10,6" stroke-width="0.25"/>
  <polygon points="7,7 7,11 10,12 10,8" stroke-width="0.25"/>
  <polygon points="10,8 10,12 13,11 13,7" stroke-width="0.25"/>
  
  <!-- 鼠标指针：指尖(3,3) 经过变换后落在 (10,8) -->
  <!-- 
    变换公式：scale(0.25) 后，指尖在 (0.75, 0.75)
    要落到 (10,8)，需要 translate(9.25, 7.25)
    即：0.75 + 9.25 = 10，0.75 + 7.25 = 8
  -->
  <g transform="translate(9.25, 7.25) scale(0.25)">
    <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" stroke="red" stroke-width="2.0" stroke-linejoin="round"/>
    <path d="M13 13l6 6" stroke="red" stroke-width="2.0" stroke-linecap="round"/>
  </g>

</svg>