<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布新文章 | FingertipSpace</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="untitled.svg" type="image/svg+xml">
    <!-- 引入字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        serif: ['"Noto Serif SC"', 'Georgia', 'serif'],
                    },
                    colors: {
                        paper: { bg: '#ffffff', surface: '#fafafa', text: '#1a1a1a', muted: '#6b7280', border: '#e5e7eb', hover: '#f3f4f6' },
                        ink: { bg: '#191919', surface: '#202020', text: '#e5e5e5', muted: '#9ca3af', border: '#2e2e2e', hover: '#2a2a2a' },
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #ffffff;
            color: #1a1a1a;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .dark body {
            background-color: #191919;
            color: #e5e5e5;
        }
        .link-underline {
            background-image: linear-gradient(currentColor, currentColor);
            background-size: 0% 1px;
            background-repeat: no-repeat;
            background-position: 0% 100%;
            transition: background-size 0.3s ease;
        }
        .link-underline:hover {
            background-size: 100% 1px;
        }
        .page-transition {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        input:focus, textarea:focus {
            outline: none;
            border-color: #3fb950;
            box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.15);
        }
        .dark input:focus, .dark textarea:focus {
            box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.25);
        }
        .btn-publish {
            background: #3fb950;
            color: #0d1117;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-publish:hover {
            background: #2ea043;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(63, 185, 80, 0.35);
        }
        .btn-publish:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .log-area {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 13px;
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
            color: #8b949e;
        }
        .dark .log-area {
            background: #010409;
            border-color: #30363d;
        }
        .log-success { color: #3fb950; }
        .log-error { color: #da3633; }
        .log-info { color: #8b949e; }
        .log-warn { color: #d29922; }
        .secret-hint {
            font-size: 12px;
            color: #8b949e;
            background: #f3f4f6;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
        }
        .dark .secret-hint {
            background: #2a2a2a;
        }
    </style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-ink-bg/80 backdrop-blur-md border-b border-paper-border dark:border-ink-border">
    <div class="max-w-2xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="/" class="text-xl font-serif font-bold text-paper-text dark:text-ink-text hover:text-gray-500 transition">
            FingertipSpace<span class="text-blue-500">.</span>
        </a>
        <nav class="flex items-center space-x-6 text-sm text-paper-muted dark:text-ink-muted font-medium">
            <a href="/" class="link-underline hover:text-paper-text dark:hover:text-ink-text">首页</a>
            <a href="/publish.html" class="link-underline hover:text-paper-text dark:hover:text-ink-text text-[#3fb950]">写文章</a>
            <button id="theme-toggle" class="p-1 hover:text-paper-text dark:hover:text-ink-text transition" title="切换主题">
                <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>
        </nav>
    </div>
</header>

<!-- ===== 主体 ===== -->
<main class="max-w-2xl mx-auto px-6 py-12 page-transition">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-sans font-light text-paper-text dark:text-ink-text mb-8 tracking-wide">发布文章</h1>
        <span class="secret-hint">日期自动生成</span>
    </div>

    <!-- 表单（已移除日期输入框） -->
    <form id="publishForm" class="space-y-5">
        <!-- 标题 -->
        <div>
            <label class="block text-sm font-medium text-paper-text dark:text-ink-text mb-1.5">标题</label>
            <input type="text" id="title" class="w-full bg-paper-bg dark:bg-ink-bg border border-paper-border dark:border-ink-border rounded-lg px-4 py-3 text-paper-text dark:text-ink-text placeholder:text-paper-muted dark:placeholder:text-ink-muted transition" placeholder="输入文章标题..." required>
        </div>

        <!-- 标签（单独一行） -->
        <div>
            <label class="block text-sm font-medium text-paper-text dark:text-ink-text mb-1.5">标签</label>
            <input type="text" id="tags" class="w-full bg-paper-bg dark:bg-ink-bg border border-paper-border dark:border-ink-border rounded-lg px-4 py-3 text-paper-text dark:text-ink-text placeholder:text-paper-muted dark:placeholder:text-ink-muted transition" placeholder="tech, 生活, 随笔">
        </div>

        <!-- 正文 -->
        <div>
            <label class="block text-sm font-medium text-paper-text dark:text-ink-text mb-1.5">正文 <span class="text-paper-muted dark:text-ink-muted text-xs font-normal">(支持 Markdown)</span></label>
            <textarea id="content" rows="12" class="w-full bg-paper-bg dark:bg-ink-bg border border-paper-border dark:border-ink-border rounded-lg px-4 py-3 text-paper-text dark:text-ink-text placeholder:text-paper-muted dark:placeholder:text-ink-muted transition font-mono text-sm leading-relaxed" placeholder="# 标题&#10;&#10;正文内容..." required></textarea>
        </div>

        <!-- 发布按钮 -->
        <button type="submit" id="publishBtn" class="btn-publish w-full rounded-lg px-6 py-3.5 text-base flex items-center justify-center gap-2 transition">
            <span id="btnText">发布文章</span>
        </button>
    </form>

    <!-- 日志输出 -->
    <div class="mt-6">
        <div class="flex items-center gap-2 text-xs text-paper-muted dark:text-ink-muted mb-2">
            <span>发布日志</span>
            <button id="clearLogBtn" class="hover:text-paper-text dark:hover:text-ink-text transition text-xs">清空</button>
        </div>
        <div class="log-area" id="log">
            <div class="log-info">➜ 系统就绪，等待发布...</div>
        </div>
    </div>
</main>

<!-- ===== 页脚 ===== -->
<footer class="border-t border-paper-border dark:border-ink-border mt-12">
    <div class="max-w-2xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center text-xs text-paper-muted dark:text-ink-muted">
        <p>&copy; 2026 circlexhy. All rights reserved.</p>
    </div>
</footer>

<script>
    // ================================================================
    // 1. 主题切换
    // ================================================================
    const themeToggle = document.getElementById('theme-toggle');
    const htmlEl = document.documentElement;
    if (localStorage.getItem('theme') === 'dark' ||
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        htmlEl.classList.add('dark');
    }
    themeToggle.addEventListener('click', () => {
        htmlEl.classList.toggle('dark');
        localStorage.setItem('theme', htmlEl.classList.contains('dark') ? 'dark' : 'light');
    });

    // ================================================================
    // 2. 日志系统
    // ================================================================
    const logDiv = document.getElementById('log');
    const clearLogBtn = document.getElementById('clearLogBtn');

    function log(msg, type = 'info') {
        const p = document.createElement('div');
        const typeMap = { success: 'log-success', error: 'log-error', info: 'log-info', warn: 'log-warn' };
        p.className = typeMap[type] || 'log-info';
        p.textContent = '> ' + msg;
        logDiv.appendChild(p);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    clearLogBtn.addEventListener('click', () => {
        logDiv.innerHTML = '';
        log('日志已清空', 'info');
    });

    // ================================================================
    // 3. 工具函数：获取当前日期（YYYY-MM-DD 格式）
    // ================================================================
    function getTodayDate() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // ================================================================
    // 4. 发布核心逻辑
    // ================================================================
    const form = document.getElementById('publishForm');
    const btn = document.getElementById('publishBtn');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = document.getElementById('title').value.trim();
        const tags = document.getElementById('tags').value.trim();
        const content = document.getElementById('content').value;

        if (!title || !content) {
            log('标题和内容不能为空', 'error');
            return;
        }

        // 自动获取当前日期，不依赖用户输入
        const date = getTodayDate();

        btn.disabled = true;
        btnText.textContent = '发布中...';
        log(`正在发送请求到 Netlify... (日期: ${date})`, 'info');

        try {
            const response = await fetch('https://githubsendblogsbackend.netlify.app/.netlify/functions/publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, date, tags, content })
            });

            const data = await response.json();

            if (data.success) {
                log(`发布成功！文章: "${title}"`, 'success');
                log(`${data.url}`, 'success');
                // 清空表单
                document.getElementById('title').value = '';
                document.getElementById('tags').value = '';
                document.getElementById('content').value = '';
            } else {
                log(`发布失败: ${data.error || '未知错误'}`, 'error');
            }
        } catch (error) {
            log(`网络错误: ${error.message}`, 'error');
            log('提示: 检查网络连接或后端函数是否正常运行', 'warn');
        } finally {
            btn.disabled = false;
            btnText.textContent = '发布文章';
        }
    });
</script>

</body>
</html>
